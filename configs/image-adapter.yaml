# configs/image-adapter.yaml
# Configuration for Image Generator Adapter

service_info:
  name: "image-generator-adapter"
  version: "1.0.0"
  environment: "production"

server:
  http_port: 8080
  grpc_port: 9090
  shutdown_timeout: 5s

logger:
  level: "info"
  format: "json"

observability:
  tracing_endpoint: "${SERVICE_OBSERVABILITY_TRACING_ENDPOINT:http://jaeger-collector:14268/api/traces}"

infrastructure:
  kafka_brokers:
    - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

  # S3 configuration for image storage
  object_storage:
    endpoint: "https://s3.us-east-005.backblazeb2.com"
    region: "us-east-005"
    bucket: "personae-prod-uk001-images"
    access_key_env_var: "B2_APPLICATION_KEY_ID"
    secret_key_env_var: "B2_APPLICATION_KEY"
    use_ssl: true
    use_path_style: false  # B2 doesn't use path-style

  # Database configs (not used by image adapter but part of ServiceConfig)
  clients_database: { }
  templates_database: { }
  auth_database: { }

# Custom configuration specific to image adapter
custom:
  ai_service:
    provider: "anthropic"
    model: "claude-3-opus-20240229"
    temperature: 0.2
    max_tokens: 2048
    api_key_env_var: "ANTHROPIC_API_KEY"

  adapter_settings:
    consumer_group: "image-generator-adapter-group"
    main_topic: "system.adapter.image-generator.requests"

  image_api:
    # External image generation API settings
    # These are read from environment variables
    url: "${IMAGE_API_URL:https://api.stability.ai/v1/generation/stable-diffusion-v1-6/text-to-image}"
    key_env_var: "IMAGE_API_KEY"

    # Default generation parameters
    defaults:
      width: 1024
      height: 1024
      cfg_scale: 7
      steps: 30
      samples: 1
      clip_guidance_preset: "FAST_BLUE"

  circuit_breaker:
    name: "image-generator-api"
    max_requests: 3
    interval_seconds: 60
    timeout_seconds: 60
    consecutive_failures: 5
    failure_ratio: 0.6

  storage:
    # S3 path template for organizing images
    path_template: "images/{client_id}/{date}/{image_id}.{format}"
    default_format: "png"

    # Image processing options
    compression:
      enabled: false
      quality: 85

    # CDN configuration (optional)
    cdn:
      enabled: false
      base_url: ""

  performance:
    # Concurrent processing limits
    max_concurrent_requests: 10

    # Timeout settings
    api_timeout_seconds: 30
    upload_timeout_seconds: 30

    # Rate limiting
    rate_limit:
      enabled: true
      requests_per_minute: 60
      burst_size: 10