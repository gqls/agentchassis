// FILE: configs/web-scrape-adapter.yaml
service_info:
  name: "web-scrape-adapter"
  version: "1.0.0"
  environment: "development"

server:
  port: "9090"

logging:
  level: "info"
  format: "json"

infrastructure:
  kafka_brokers:
    - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

  clients_database: {}
  templates_database: {}
  auth_database: {}
  object_storage:
    endpoint: "https://s3.us-east-005.backblazeb2.com"
    region: "us-east-005"
    bucket: "personae-prod-uk001-webscrape"
    access_key_env_var: "B2_APPLICATION_KEY_ID"  # Tells adapter which env var to read
    secret_key_env_var: "B2_APPLICATION_KEY"     # Tells adapter which env var to read
    use_ssl: true
    use_path_style: false

  adapter:
    request_topic: "system.adapter.webscrape.requests"
    consumer_group: "webscrape-adapter-group"
    max_retries: 3
    timeout: 120s

  providers:
    firecrawl:
      enabled: true
      api_url: "https://api.firecrawl.dev/v1"
      timeout: 60s

custom:
  scrape_provider: "firecrawl"
  max_results_default: 10
  timeout_seconds: 30