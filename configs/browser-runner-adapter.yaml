# FILE: configs/browser-runner-adapter.yaml
#
# LOCAL-RUN config for the browser-runner adapter (main.go's -config default).
# The deployed source of truth is the overlay copy:
#   deployments/kustomize/services/browser-runner-adapter/overlays/production/uk_001/configs/browser-runner-adapter.yaml
# Keep the two in sync when editing. Field names follow 035 §2.11 exactly
# (logging not logger, port as a quoted string).

service_info:
  name: "browser-runner-adapter"     # used as sender_agent_type in responses
  version: "0.1.0"
  environment: "development"

server:
  port: "8080"                       # STRING in quotes; reads as cfg.Server.Port

logging:
  level: "info"
  format: "json"

observability:
  tracing_endpoint: "${SERVICE_OBSERVABILITY_TRACING_ENDPOINT:http://jaeger-collector:14268/api/traces}"

infrastructure:
  kafka_brokers:
    - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

  # P3 failure screenshots need object storage; local runs usually have no B2
  # credentials, so this stays empty and the adapter logs "screenshots
  # disabled" (P0–P2 behaviour is unaffected). To exercise them locally,
  # mirror the production overlay's object_storage block and export
  # B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY.
  object_storage: {}

  # The runner uses no database.
  clients_database: {}
  templates_database: {}
  auth_database: {}

custom:
  adapter_settings:
    consumer_group: "browser-runner.adapter.group"
    main_topic: "system.adapter.browser-runner.requests"
