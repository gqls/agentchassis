# FILE: configs/auth-service.yaml
service_info:
  name: "personae-auth-service"
  version: "1.1.0"
  environment: "development"

server:
  port: "8081"

logging:
  level: "debug"

observability:
  tracing_endpoint: "otel-collector.monitoring.svc.cluster.local:4317"

infrastructure:
  auth_database:
    host: "rs17.uk-noc.com"
    port: 3306
    user: "catalogu_personae"
    db_name: "catalogu_vectordb_chassis"
    password_env_var: "AUTH_DB_PASSWORD"
    ssl_mode: "disable"

  kafka_brokers: []
  # clients_db (Postgres) — billing truth lives beside the customer identity
  # it prices (vouchers / billing_orders / billing_events / billing_settings,
  # migration 391). Same block as core-manager's; CLIENTS_DB_PASSWORD is
  # already present in personae-platform-secrets, which this pod mounts.
  clients_database:
    host: "pgbouncer.ai-persona-system.svc.cluster.local"
    port: 6432
    user: "clients_user"
    password_env_var: "CLIENTS_DB_PASSWORD"
    db_name: "clients_db"
    sslmode: "disable"
  templates_database: {}
  object_storage: {}

custom:
  jwt_secret_key_env_var: "JWT_SECRET_KEY"
  jwt_expiry_access_minutes: 60
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  core_manager_url: "http://core-manager:8088"
  tiers:
    free_tier:
      max_personas_allowed: 1
      max_content_allowed: 5
    premium_tier:
      max_personas_allowed: -1
      max_content_allowed: -1