<div class="calc-grid">
        <div class="card">
            <div class="form-group">
                <label>{{.label_1}}</label>
                <input type="number" id="loanAmount" value="250000">
            </div>
            <div class="form-group">
                <label>{{.label_2}}</label>
                <input type="number" id="interestRate" value="4.5" step="0.1">
            </div>
            <div class="form-group">
                <label>{{.label_3}}</label>
                <input type="number" id="termYears" value="25">
            </div>
            <button id="btn-calculate" class="btn-primary" onclick="runCalc()">{{.button_1}}</button>
        </div>

        <div class="result-box" id="resultsArea">
            <label>{{.label_4}}</label>
            <div class="big-number" id="displayMonthly">£0.00</div>

            <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label style="font-size:0.8rem;">{{.label_5}}</label>
                    <strong id="displayTotalInterest">£0.00</strong>
                </div>
                <div>
                    <label style="font-size:0.8rem;">{{.label_6}}</label>
                    <strong id="displayTotalRepayable">£0.00</strong>
                </div>
            </div>
        </div>
    </div>
<div class="card" style="margin-top: 30px;">
        <h3>{{.heading_1}}</h3>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse: collapse; font-size: 0.9rem;">
                <thead>
                <tr style="text-align:left; border-bottom:2px solid #eee;">
                    <th style="padding:10px;">Year</th>
                    <th style="padding:10px;">Interest Paid</th>
                    <th style="padding:10px;">Capital Paid</th>
                    <th style="padding:10px;">Balance</th>
                </tr>
                </thead>
                <tbody id="amortizationTable">
                </tbody>
            </table>
        </div>
    </div>
<script src="/assets/js/calculators.js"></script>
<script>
    function runCalc() {
        const P = parseFloat(document.getElementById('loanAmount').value);
        const R = parseFloat(document.getElementById('interestRate').value);
        const Y = parseFloat(document.getElementById('termYears').value);

        const res = calculateAmortization(P, R, Y);

        document.getElementById('displayMonthly').innerText = formatGBP(res.monthly);
        document.getElementById('displayTotalInterest').innerText = formatGBP(res.interest);
        document.getElementById('displayTotalRepayable').innerText = formatGBP(res.total);

        // Generate Table
        const monthlyRate = (R/100)/12;
        let balance = P;
        let yearInt = 0;
        let yearCap = 0;
        const tbody = document.getElementById('amortizationTable');
        tbody.innerHTML = "";

        for(let i=1; i <= Y*12; i++) {
            const intPay = balance * monthlyRate;
            const capPay = res.monthly - intPay;
            balance -= capPay;
            if(balance < 0) balance = 0;

            yearInt += intPay;
            yearCap += capPay;

            if(i % 12 === 0) {
                const row = `<tr>
                        <td style="padding:10px; border-bottom:1px solid #eee;">Year ${i/12}</td>
                        <td style="padding:10px; border-bottom:1px solid #eee;">${formatGBP(yearInt)}</td>
                        <td style="padding:10px; border-bottom:1px solid #eee;">${formatGBP(yearCap)}</td>
                        <td style="padding:10px; border-bottom:1px solid #eee;">${formatGBP(balance)}</td>
                    </tr>`;
                tbody.innerHTML += row;
                yearInt = 0; yearCap = 0;
            }
        }
    }
    window.onload = runCalc;
</script>
