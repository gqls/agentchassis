# deployments/kustomize/services/pgbouncer/pgbouncer-secret.yaml
#
# Contains the userlist.txt that PgBouncer uses for authentication.
# Passwords must match what PostgreSQL has for each user.
#
# IMPORTANT: Before applying, replace CLIENTS_PASSWORD_HERE and
# TEMPLATES_PASSWORD_HERE with actual passwords from your existing
# personae-platform-secrets secret.
#
# To get current passwords:
#   kubectl -n ai-persona-system get secret personae-platform-secrets -o jsonpath='{.data.CLIENTS_DB_PASSWORD}' | base64 -d
#   kubectl -n ai-persona-system get secret personae-platform-secrets -o jsonpath='{.data.TEMPLATES_DB_PASSWORD}' | base64 -d
#
# The admin user is for pgbouncer's own admin console (SHOW POOLS etc.)
#
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-userlist
  namespace: ai-persona-system
type: Opaque
stringData:
  userlist.txt: |
    "clients_user" "CLIENTS_PASSWORD_HERE"
    "templates_user" "TEMPLATES_PASSWORD_HERE"
    "pgbouncer_admin" "PGBOUNCER_ADMIN_PASSWORD_HERE"