apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner-vmsites
  namespace: ai-persona-system
  labels:
    app: github-actions-runner-vmsites
spec:
  # One replica: vm-sites receives a handful of pushes a day, and each deploy
  # job is an rsync that finishes in seconds.
  replicas: 1
  selector:
    matchLabels:
      app: github-actions-runner-vmsites
  template:
    metadata:
      labels:
        app: github-actions-runner-vmsites
        # bugs_open/252 candidate 1b — the SAME value as in
        # services/github-actions-runner/base/deployment.yaml, deliberately.
        # These two deployments are one disk-consumption pool sharing one
        # image, and this label is the only thing that says so. The long
        # rationale lives in that file; if you change the value, change it in
        # both or the constraint silently stops spanning them and the pairing
        # that opened 252 becomes legal again.
        workload: gha-runner
    spec:
      serviceAccountName: ai-persona-app
      terminationGracePeriodSeconds: 60
      # bugs_open/252 candidate 1b — identical constraint to the sibling
      # deployment. It must be repeated here rather than inherited: a
      # topologySpreadConstraint is a property of the pod, so a pod carrying no
      # constraint is placed freely no matter what its neighbours ask for. This
      # is the pod that was co-located with a github-actions-runner replica on
      # ...1149, the node that hit DiskPressure at 12:08Z on 2026-08-11.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              workload: gha-runner
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: runner
          image: docker.io/aqls/github-actions-runner:latest
          env:
            - name: GITHUB_OWNER
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: GITHUB_OWNER
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: GITHUB_REPO
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_LABELS
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: RUNNER_LABELS
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              # bugs_open/252 — see the long note in
              # services/github-actions-runner/base/deployment.yaml. Same image,
              # same build-cache behaviour: MEASURED 2276 MB rootfs 2026-08-11.
              # This pod and a github-actions-runner replica were co-located on
              # prod-instance-...1149, the node that hit DiskPressure at 12:08Z.
              # Requesting disk is what stops the scheduler doing that again.
              # No limit, deliberately — a limit would evict a large build.
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
