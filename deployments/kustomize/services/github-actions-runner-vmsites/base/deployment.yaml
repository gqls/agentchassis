apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner-vmsites
  namespace: ai-persona-system
  labels:
    app: github-actions-runner-vmsites
spec:
  # One replica: vm-sites receives a handful of pushes a day, and each deploy
  # job is an rsync that finishes in seconds.
  replicas: 1
  selector:
    matchLabels:
      app: github-actions-runner-vmsites
  template:
    metadata:
      labels:
        app: github-actions-runner-vmsites
    spec:
      serviceAccountName: ai-persona-app
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: runner
          image: docker.io/aqls/github-actions-runner:latest
          env:
            - name: GITHUB_OWNER
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: GITHUB_OWNER
            - name: GITHUB_REPO
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: GITHUB_REPO
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_LABELS
              valueFrom:
                configMapKeyRef:
                  name: github-runner-vmsites-config
                  key: RUNNER_LABELS
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              # bugs_open/252 — see the long note in
              # services/github-actions-runner/base/deployment.yaml. Same image,
              # same build-cache behaviour: MEASURED 2276 MB rootfs 2026-08-11.
              # This pod and a github-actions-runner replica were co-located on
              # prod-instance-...1149, the node that hit DiskPressure at 12:08Z.
              # Requesting disk is what stops the scheduler doing that again.
              # No limit, deliberately — a limit would evict a large build.
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
