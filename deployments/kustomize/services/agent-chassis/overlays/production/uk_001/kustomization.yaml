apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base
  - rbac-job-spawner.yaml
  - configmap.yaml

labels:
  - pairs:
      environment: production
      region: uk

images:
  - name: docker.io/aqls/agent-chassis
    newTag: v1.0.1358

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: agent-chassis