apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../base

# Add development-specific labels
labels:
  - pairs:
      environment: development

images:
  - name: docker.io/aqls/agent-chassis
    newTag: v1.0.2  # This will be dynamically updated

patches:
  - path: patch-deployment-dev.yaml
    target:
      kind: Deployment
      name: agent-chassis
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: agent-chassis