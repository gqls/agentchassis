apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-chassis
  labels:
    app: agent-chassis
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: agent-chassis
  template:
    metadata:
      labels:
        app: agent-chassis
    spec:
      serviceAccountName: ai-persona-app
      # Shutdown() drains consumers for up to 30s; the default 30s grace killed
      # the pod mid-drain, and any message in flight was gone under the old
      # commit-before-process consume (bugs_open/003 F3). 60s lets the drain
      # finish; preStop stops new fetches racing the SIGTERM handler.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: agent-chassis
          image: docker.io/aqls/agent-chassis:latest # Patched by overlays
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8080
            # DECLARED so the PodMonitor can discover it — not decoration, and not
            # merely documentation. A PodMonitor's numeric `targetPort: 9090`
            # compiles to `keep __meta_kubernetes_pod_container_port_number == 9090`,
            # which matches the port a pod DECLARES, never the port it actually
            # serves. Until 2026-08-12 this Deployment served /metrics on 9090 while
            # declaring only 8080, so both chassis pods passed the `app` selector and
            # were then dropped at the port arm: 0 of 141 active targets. The spawned
            # agent pods were scraped throughout because spawn_actions.go declares
            # 9090 for them — which is why the gap read as "metrics work fine".
            - containerPort: 9090
              name: metrics
          env:
            # Inject the new bootstrap key from the platform secrets
            - name: AGENT_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: agent-bootstrap-key
          envFrom:
            - configMapRef:
                name: placeholder-config # Patched by overlays
            - secretRef:
                name: placeholder-secrets # Patched by overlays
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          # /health and /ready report real state as of the 2026-07-20 build
          # (Kafka reachability + agent started — bugs_open/003 F4). Liveness
          # only fails after KAFKA_UNHEALTHY_AFTER_SECONDS (default 300s) of
          # continuous unreachability, so probe cadence here is not the
          # flake-tolerance knob — the endpoint is.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3