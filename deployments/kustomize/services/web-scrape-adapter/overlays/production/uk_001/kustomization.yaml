apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-persona-system

resources:
  - ../../../base
  - configmap.yaml

labels:
  - pairs:
      environment: production
      region: uk
      cluster: uk_001

images:
  - name: docker.io/aqls/web-scrape-adapter
    newTag: v1.0.1359

replicas:
  - name: web-scrape-adapter
    count: 3

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: web-scrape-adapter
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: web-scrape-adapter

commonAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"