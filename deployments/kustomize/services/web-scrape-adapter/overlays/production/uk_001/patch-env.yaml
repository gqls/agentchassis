apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-scrape-adapter
spec:
  template:
    spec:
      serviceAccountName: ai-persona-app
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: web-scrape-adapter
          env:
            # Kafka configuration
            - name: KAFKA_BROKERS
              value: "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_REQUEST_TOPIC
              value: "system.adapter.webscrape.requests"
            - name: KAFKA_CONSUMER_GROUP
              value: "webscrape-adapter-group"

            - name: REQUEST_THROTTLE_MS
              value: "5000"     # 5 seconds between requests

            # Firecrawl configuration
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-default-secrets
                  key: FIRECRAWL_API_KEY
            - name: FIRECRAWL_API_URL
              value: "https://api.firecrawl.dev/v2"

            # ScrapingBee configuration (if using)
            - name: SCRAPING_BEE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-default-secrets
                  key: SCRAPING_BEE_API_KEY
                  optional: true

            # S3/B2 Storage configuration
            - name: S3_ENDPOINT
              value: "https://s3.us-east-005.backblazeb2.com"
            - name: S3_REGION
              value: "us-east-005"
            - name: WEBSCRAPE_BUCKET
              value: "personae-prod-uk001-webscrape"
            - name: S3_USE_PATH_STYLE
              value: "false"
            - name: B2_APPLICATION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY_ID
            - name: B2_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY

            # Performance tuning
            - name: MAX_CONCURRENT_REQUESTS
              value: "10"
            - name: REQUEST_TIMEOUT
              value: "180s"
            - name: CACHE_ENABLED
              value: "true"
            - name: CACHE_TTL
              value: "3600"

          envFrom:
            # B2/S3 credentials
            - secretRef:
                name: personae-storage-secrets
            # Load storage config
            - configMapRef:
                name: storage-config
            # Keep existing configmap
            - configMapRef:
                name: personae-prod-config