apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-persona-system

resources:
  - ../../../base
  - configmap.yaml

labels:
  - pairs:
      environment: production
      region: uk
      cluster: uk_001

annotations:
  - pairs:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"
      prometheus.io/path: "/metrics"

images:
  - name: docker.io/aqls/webscrape-adapter
    newTag: v1.0.1

replicas:
  - name: webscrape-adapter
    count: 3

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: webscrape-adapter
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: webscrape-adapter