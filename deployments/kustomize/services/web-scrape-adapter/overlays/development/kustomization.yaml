apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-persona-system

resources:
  - ../../base
  - configmap.yaml

labels:
  - pairs:
      environment: development
      team: platform

images:
  - name: docker.io/aqls/web-scrape-adapter
    newTag: latest

replicas:
  - name: web-scrape-adapter
    count: 1

patches:
  - path: patch-deployment-dev.yaml
    target:
      kind: Deployment
      name: web-scrape-adapter