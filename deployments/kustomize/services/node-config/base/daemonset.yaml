# bugs_open/252 candidates 3a + 3b — node-level kubelet image-GC configuration.
#
# WHY A DAEMONSET AND NOT THE kubelet-config CONFIGMAP: the kube-system
# `kubelet-config` ConfigMap is PROVIDER-PROTECTED on this hosted control plane
# (Rackspace ngpc). Writes to it return 200 "patched" and are silently reverted
# before the next read — measured 2026-08-14: three write shapes (data.kubelet
# merge patch, a new data key, an annotation) all accepted and all gone on
# re-read, with no mutating webhook on configmaps to explain it. So the only
# tenant-reachable home for kubelet settings is the file on each node, and the
# only durable carrier for a file edit on SPOT nodes (replaced without notice)
# is a DaemonSet that reapplies it — a hand edit evaporates with the node.
#
# WHAT IT CHANGES, per node, idempotently:
#   imageGCHighThresholdPercent  85 -> 70   (start reclaiming at 70% used, not
#                                            at the eviction line — 85% used IS
#                                            15% free, the imagefs eviction
#                                            threshold, which is bugs_open/252's
#                                            confirmed root cause)
#   imageGCLowThresholdPercent   80 -> 60   (each pass digs deeper, runs less)
#   imageMaximumGCAge            0s -> 168h (retire images unused for a week
#                                            regardless of pressure; gate
#                                            ImageMaximumGCAge is on by default
#                                            since 1.30, cluster is 1.31)
#
# HOW: privileged + hostPID, edit via chroot /proc/1/root — the /proc/1/root
# route reaches the host's REAL mount namespace (a hostPath bind of / would
# show an empty /run and systemctl would fail). Restarts kubelet ONLY when the
# file actually changed; a kubelet restart does not restart running pods.
# Verified mechanism 2026-08-14 on ...1148: systemctl reachable, the three
# lines present verbatim in /var/lib/kubelet/config.yaml, kubelet running with
# --config pointing at it.
#
# FAILURE DIRECTION: if the file does not contain all three expected keys, or
# does not verify after the edit, the pod restores the backup and EXITS 1 — a
# visible CrashLoopBackOff on that node, never a silent half-edit.
#
# EXPECT ON FIRST ROLLOUT: nodes currently run at ~75-83% used, which is above
# the new high threshold, so image GC will reclaim immediately (unused images
# only — deletion, not disruption). That is the intended steady state arriving
# at once, not a fault.
#
# Candidate 5 (journald SystemMaxUse) deliberately NOT here yet — it trades
# ~70 days of node-log retention for ~10 and the owner has not taken that
# decision. When taken, it is a second block in the same script.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-config
  namespace: ai-persona-system
  labels:
    app: node-config
spec:
  selector:
    matchLabels:
      app: node-config
  template:
    metadata:
      labels:
        app: node-config
    spec:
      hostPID: true
      tolerations:
        # run on every node, including one already tainted by disk pressure —
        # a node under pressure is exactly the node that needs this config
        - operator: Exists
      containers:
        - name: apply
          image: docker.io/library/busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -u
              H=/proc/1/root
              F=/var/lib/kubelet/config.yaml
              want() {
                chroot $H grep -q "^imageGCHighThresholdPercent: 70$" $F &&
                chroot $H grep -q "^imageGCLowThresholdPercent: 60$" $F &&
                chroot $H grep -q "^imageMaximumGCAge: 168h$" $F
              }
              if want; then
                echo "node-config(252): kubelet GC already 70/60/168h — nothing to do"
              else
                # refuse to edit a file that lacks the expected keys: sed would
                # silently no-op and a later reader would trust a half-state
                for k in imageGCHighThresholdPercent imageGCLowThresholdPercent imageMaximumGCAge; do
                  chroot $H grep -q "^$k: " $F || { echo "node-config(252): $F lacks '$k:' — refusing to edit"; exit 1; }
                done
                echo "node-config(252): before:"; chroot $H grep -E "^imageGC|^imageMaximumGCAge" $F
                chroot $H sed -i.bak-252 \
                  -e 's/^imageGCHighThresholdPercent: .*/imageGCHighThresholdPercent: 70/' \
                  -e 's/^imageGCLowThresholdPercent: .*/imageGCLowThresholdPercent: 60/' \
                  -e 's/^imageMaximumGCAge: .*/imageMaximumGCAge: 168h/' $F
                if want; then
                  echo "node-config(252): after:"; chroot $H grep -E "^imageGC|^imageMaximumGCAge" $F
                  chroot $H systemctl restart kubelet \
                    && echo "node-config(252): kubelet restarted (running pods unaffected)" \
                    || { echo "node-config(252): kubelet restart FAILED"; exit 1; }
                else
                  echo "node-config(252): VERIFY FAILED after edit — restoring backup"
                  chroot $H cp $F.bak-252 $F
                  exit 1
                fi
              fi
              # hold so the DaemonSet stays green; re-runs (pod restart, node
              # replacement) re-enter the idempotent check above
              while true; do sleep 3600; done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
