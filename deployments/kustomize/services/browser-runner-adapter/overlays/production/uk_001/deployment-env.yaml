# Per-cluster environment for the browser-runner adapter (strategic-merge
# patch, matched into the container by name). NewAdapter falls back to the
# defaults if unset; set explicitly so a cluster can rename its topic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-runner-adapter
spec:
  template:
    spec:
      containers:
        - name: browser-runner-adapter
          env:
            - name: REQUESTS_TOPIC
              value: "system.adapter.browser-runner.requests"
            - name: CONSUMER_GROUP
              value: "browser-runner.adapter.group"
            - name: AGENT_VERSION
              value: "0.1.0"
            # P3 failure screenshots — same storage the imagegenerator uses
            # (bucket + endpoint are in the adapter's config file; region and
            # path-style are env-only knobs of platform/storage). Missing
            # secret → screenshots disabled, checks unaffected.
            - name: S3_REGION
              value: "us-east-005"
            - name: S3_USE_PATH_STYLE
              value: "false"
            - name: B2_APPLICATION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY_ID
            - name: B2_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY
