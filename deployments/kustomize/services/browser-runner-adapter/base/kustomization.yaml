apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base is cluster-agnostic: Deployment + Service only (analyser-adapter
# precedent). The configMapGenerator lives in each OVERLAY — the service
# config carries per-cluster values (kafka brokers, environment), so each
# overlay supplies its own configs/browser-runner-adapter.yaml.
resources:
  - deployment.yaml
  - service.yaml
