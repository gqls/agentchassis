apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base

labels:
  - pairs:
      environment: production
      region: uk

# Pinned, like every other overlay here. This is a CronJob image on its OWN tag
# sequence — it does NOT ride the fleet release. Bump this when you rebuild the
# image, in the SAME commit as the rebuild (landmine: a deploy target alone
# ships NOTHING — the pin is what moves the cluster).
images:
  - name: docker.io/aqls/content-loss-check
    newTag: v1.0.1361
