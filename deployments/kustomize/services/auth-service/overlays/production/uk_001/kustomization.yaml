apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base

labels:
  - pairs:
      environment: production
      region: uk

images:
  - name: docker.io/aqls/auth-servic
    newTag: v1.0.2  # This will be dynamically updated

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: auth-service