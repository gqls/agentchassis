apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  template:
    spec:
      imagePullSecrets:
        - name: docker-hub-creds
      serviceAccountName: ai-persona-app
      containers:
        - name: auth-service
          env:
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: AUTH_DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: JWT_SECRET_KEY
            - name: GO_ENV
              value: "production"
            - name: AUTH_DB_USER
              value: "catalogu_personae"