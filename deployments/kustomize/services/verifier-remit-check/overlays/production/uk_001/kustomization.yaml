apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base

labels:
  - pairs:
      environment: production
      region: uk

# Pinned, like every other overlay here. This is a CronJob image on its OWN tag
# sequence — it does NOT ride the fleet release, because nothing in a pipeline
# depends on it and rebuilding it for every chassis roll would be noise. Bump this
# when you rebuild the image, not when the fleet rolls.
images:
  - name: docker.io/aqls/verifier-remit-check
    newTag: v1.0.1361
