apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base
  - configmap.yaml

labels:
  - pairs:
      environment: production
      region: uk

images:
  - name: docker.io/aqls/image-generator-adapter
    newTag: v1.0.1360

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: image-generator-adapter
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: image-generator-adapter