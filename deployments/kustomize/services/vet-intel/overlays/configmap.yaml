apiVersion: v1
kind: ConfigMap
metadata:
  name: vet-intel-config
  namespace: ai-persona-system
data:
  agent-chassis.yaml: |
    service_info:
      name: vet-intel-orchestrator
      version: "1.0.0"
      environment: production

    server:
      port: "8080"

    logging:
      level: info

    infrastructure:
      kafka_brokers:
        - personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092

      clients_database:
        host: pgbouncer.ai-persona-system.svc.cluster.local
        port: 6432
        db_name: clients_db
        user: clients_user
        ssl_mode: disable