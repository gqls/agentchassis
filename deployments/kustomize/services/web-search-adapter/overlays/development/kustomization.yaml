apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../base

labels:
  - pairs:
      environment: development

images:
  - name: docker.io/aqls/web-search-adapter
    newTag: v1.0.2  # This will be dynamically updated

patches:
  - path: patch-deployment-dev.yaml
    target:
      kind: Deployment
      name: web-search-adapter
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: web-search-adapter