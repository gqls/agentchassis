apiVersion: v1
kind: ConfigMap
metadata:
  name: business-intel-config
  namespace: ai-persona-system
  labels:
    app: business-intel
    component: agent
data:
  agent-chassis.yaml: |
    service_info:
      name: "business-intel"
      version: "1.0.0"
      environment: "production"

    server:
      port: "8085"

    logging:
      level: "info"

    observability:
      tracing_endpoint: "otel-collector.monitoring.svc.cluster.local:4317"

    infrastructure:
      kafka_brokers:
        - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

      clients_database:
        host: "pgbouncer.ai-persona-system.svc.cluster.local"
        port: 6432
        user: "clients_user"
        password_env_var: "CLIENTS_DB_PASSWORD"
        db_name: "clients_db"
        sslmode: "disable"

      templates_database:
        host: "postgres-templates.ai-persona-system.svc.cluster.local"
        port: 5432
        user: "templates_user"
        password_env_var: "TEMPLATES_DB_PASSWORD"
        db_name: "templates_db"
        sslmode: "disable"

      auth_database: {}