apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-intel
  namespace: ai-persona-system
  labels:
    app: business-intel
    agent-type: business-intel
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: business-intel
  template:
    metadata:
      labels:
        app: business-intel
        agent-type: business-intel
        component: agent
    spec:
      serviceAccountName: ai-persona-app
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: agent
          image: docker.io/aqls/agent-chassis:latest  # patched by overlay
          ports:
            - containerPort: 8080
              name: health
          envFrom:
            - configMapRef:
                name: personae-prod-config
            - secretRef:
                name: personae-default-secrets
          env:
            - name: AGENT_TYPE
              value: "business-intel"
            - name: KAFKA_TOPIC
              value: "system.agent.business-intel.requests"
            - name: KAFKA_TOPICS
              value: "system.agent.business-intel.requests"
            - name: KAFKA_CONSUMER_GROUP
              value: "business-intel-group"
            - name: REQUESTS_TOPIC
              value: "system.agent.business-intel.requests"
            - name: RESPONSES_TOPIC
              value: "system.agent.business-intel.responses"
            - name: PARENT_RESPONSES_TOPIC
              value: "system.agent.business-intel.responses"
            - name: AGENT_IMAGE_REPOSITORY
              value: "docker.io/aqls"
            - name: AGENT_IMAGE_TAG
              value: "v1.0.872"
            - name: AGENT_STORAGE_SECRET
              value: "personae-storage-secrets"
            - name: AGENT_STORAGE_CONFIGMAP
              value: "storage-config"
            - name: COMPANIES_HOUSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-default-secrets
                  key: COMPANIES_HOUSE_API_KEY
            - name: AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CLIENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: CLIENTS_DB_PASSWORD
            - name: TEMPLATES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: TEMPLATES_DB_PASSWORD
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personae-platform-secrets
                  key: AUTH_DB_PASSWORD
            - name: CLIENTS_DATABASE_URL
              value: "postgresql://clients_user:$(CLIENTS_DB_PASSWORD)@pgbouncer.ai-persona-system.svc.cluster.local:6432/clients_db?sslmode=disable&default_query_exec_mode=cache_describe"
            - name: TEMPLATES_DATABASE_URL
              value: "postgresql://templates_user:$(TEMPLATES_DB_PASSWORD)@postgres-templates.ai-persona-system.svc.cluster.local:5432/templates_db?sslmode=disable"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: B2_APPLICATION_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY_ID
            - name: B2_APPLICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: personae-storage-secrets
                  key: B2_APPLICATION_KEY
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: business-intel-config