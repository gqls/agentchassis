apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-persona-system
resources:
  - ../../../base

labels:
  - pairs:
      environment: production
      region: uk

# Pinned, like every other check service here. `latest` in the base is the
# placeholder the overlay replaces; a CronJob left on `latest` re-pulls whatever
# was pushed last, which is how a scheduled check silently changes behaviour
# between runs with no diff anybody reviewed.
#
# ⚠ The declarations are COMPILED INTO this binary, so a stale tag here is a stale
# SPEC — the check would keep reporting clean against yesterday's declarations.
# Bump it with the rebuild, in the same commit.
images:
  - name: docker.io/aqls/live-declaration-drift-check
    newTag: v1.0.1359
