# deployments/kustomize/services/agent-dispatcher/overlays/production/uk_001/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-dispatcher-config
  namespace: ai-persona-system
data:
  agent-dispatcher.yaml: |
    service_info:
      name: agent-dispatcher
      version: "1.0.0"
      environment: production

    logging:
      level: info

    dispatcher:
      cluster_id: uk_001
      namespace: ai-persona-system
      dispatch_topic: system.dispatch.requests
      dispatch_response_topic: system.dispatch.responses

    infrastructure:
      kafka_brokers:
        - personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092

      # Override endpoints for agents spawned in THIS cluster.
      # If the dispatcher is in a remote cluster, these point to the
      # remote cluster's local PgBouncer / Kafka endpoint.
      # If omitted, the dispatcher uses values from the dispatch message.
      #
      # agent_overrides:
      #   kafka_brokers: "kafka-external.example.com:9094"
      #   database_host: "pgbouncer-clients.ai-persona-system.svc.cluster.local"
      #   database_port: "6432"
      #   core_manager_url: "http://core-manager.ai-persona-system.svc.cluster.local:8088"
