apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-persona-system

resources:
  - ../../../base

# Pin the image. Update newName to your container registry path when
# the build pipeline pushes the actual image.
# Example: newName: docker.io/aqls/thunder-adapter
images:
  - name: thunder-adapter
    newTag: v0.1.0
