# FILE: deployments/kustomize/services/content-creator-agent/overlays/production/uk_001/configs/configmap-content-creator.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-creator-agent-configmap # Matches volume name in deployment
  namespace: ai-persona-system
data:
  content-creator-agent.yaml: | # This is the content of your configs/content-creator-agent.yaml
    service_info:
      name: "content-creator-agent"
      version: "1.0.0"
      environment: "production"

    server:
      port: "8088"
    
    logging:
      level: "info"

    observability:
      tracing_endpoint: "otel-collector.monitoring.svc.cluster.local:4317"

    infrastructure:
      kafka_brokers:
        - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

      clients_database:
        host: "pgbouncer.ai-persona-system.svc.cluster.local"
        port: 6432
        user: "clients_user"
        password_env_var: "CLIENTS_DB_PASSWORD" # This will be set by a secret
        db_name: "clients_db"
        sslmode: "disable"

      templates_database: {}
      auth_database: {}
      object_storage: {}

    custom:
      agent_type: "content-creator"
      topic: "system.agent.content-creator.process"
      kafka_consumer_group: "content-creator-agent-group"
      ai_service:
        # Second attempt at Gemini (bugs_open/107; the first was reverted
        # 2026-07-24 by 4dd5d6378 because our client passed Anthropic-sized
        # max_tokens straight into Gemini's TOTAL output ceiling, starving the
        # answer). Owner chose the pro tier for quality / provider diversity.
        #
        # A floating pointer, not a pinned snapshot, on purpose: Google closes
        # pinned GENERATIONS to newly-issued keys, and gemini-2.5-pro still 404s
        # for this key (re-verified 2026-07-27). NewGeminiClient refuses the
        # known-dead pins at construction.
        #
        # No thinking knob set: the reserve (default 8192, measured) is what makes
        # the call work, and neither knob CAPS thinking — they only reduce it. Add
        # thinking_level: "low" here if cost needs trimming, and re-measure with
        # scripts/gemini-probe.sh rather than guessing.
        provider: "gemini"
        model: "gemini-pro-latest"
        api_key_env_var: "GEMINI_API_KEY"
      metrics:
        enabled: true
        fail_silently: true
        detailed_errors: false