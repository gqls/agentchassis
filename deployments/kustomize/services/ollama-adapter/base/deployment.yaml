apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-adapter
  labels:
    app: ollama-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-adapter
  template:
    metadata:
      labels:
        app: ollama-adapter
    spec:
      # Ensure pods land on different nodes - required, not preferred
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ollama-adapter
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: model-pull
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              SERVER_PID=$!
              for i in $(seq 1 30); do
                ollama list > /dev/null 2>&1 && break
                sleep 1
              done
              echo "Ollama server ready, pulling models..."
              ollama pull nomic-embed-text
              echo "nomic-embed-text pulled"
              ollama pull mistral-small3.1
              echo "mistral-small3.1 pulled"
              echo "All models pulled successfully"
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null
              echo "Init complete"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              ephemeral-storage: "20Gi"
            limits:
              cpu: "4"
              memory: "20Gi"
              ephemeral-storage: "25Gi"
      containers:
        - name: ollama
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "2"
              memory: "20Gi"
              ephemeral-storage: "20Gi"
            limits:
              cpu: "8"
              memory: "30Gi"
              ephemeral-storage: "25Gi"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ollama-models
          emptyDir:
            sizeLimit: 30Gi
