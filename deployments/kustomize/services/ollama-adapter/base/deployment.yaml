apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-adapter
  labels:
    app: ollama-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-adapter
  template:
    metadata:
      labels:
        app: ollama-adapter
    spec:
      initContainers:
        - name: model-pull
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              SERVER_PID=$!
              for i in $(seq 1 30); do
                ollama list > /dev/null 2>&1 && break
                sleep 1
              done
              echo "Ollama server ready, checking models..."

              # Only pull models not already present
              for model in nomic-embed-text mistral-small3.1; do
                if ollama list | grep -q "$model"; then
                  echo "$model already present, skipping"
                else
                  echo "Pulling $model..."
                  ollama pull $model
                  echo "$model pulled"
                fi
              done

              echo "All models ready"
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null
              echo "Init complete"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "20Gi"
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          ports:
            - containerPort: 11434
              name: http
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "2"
              memory: "20Gi"
            limits:
              cpu: "8"
              memory: "30Gi"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
