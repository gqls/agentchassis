# FILE: deployments/terraform/environments/production/uk001/100-bootstrap-agents/agent-chassis.yaml
service_info:
  name: "agent-chassis"
  version: "v1.0.47"
  environment: "production"

server:
  port: "8088"

logging:
  level: "info"

observability:
  tracing_endpoint: "otel-collector.monitoring.svc.cluster.local:4317"

infrastructure:
  kafka_brokers:
    - "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"

  clients_database:
    host: "postgres-clients.ai-persona-system.svc.cluster.local"
    port: 5432
    user: "clients_user"
    password_env_var: "CLIENTS_DB_PASSWORD"
    db_name: "clients_db"
    sslmode: "disable"

  templates_database: {}
  auth_database: {}
  object_storage: {}

custom:
  agent_type: "generic"
  topic: "system.agent.generic.process"
  kafka_consumer_group: "generic-orchestrator-group"