<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Darts Online</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<main>
    <section class="hero hero-contact" data-component="hero-contact">
        <div class="hero-content">
            <h1>Get in Touch</h1>
            <p class="hero-subheadline">Got a question about barrels, weights, or finding the right setup? We're here for it. Drop us a message and we'll point you in the right direction.</p>
        </div>
    </section>
    <style>
        .hero-contact {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            --hero-ink: var(--color-primary-text);
            background: var(--color-primary);
            background: linear-gradient(135deg, var(--color-primary) 0%, color-mix(in srgb, var(--color-primary) 85%, var(--color-primary-text)) 100%);

            /* Dark section context */
            --section-text: color-mix(in srgb, var(--hero-ink) 90%, transparent);
            --section-text-muted: color-mix(in srgb, var(--hero-ink) 70%, transparent);
            --section-heading: var(--hero-ink);
            --section-surface: color-mix(in srgb, var(--hero-ink) 5%, transparent);
            --section-border: color-mix(in srgb, var(--hero-ink) 20%, transparent);
        }
        .hero-contact .hero-content {
            max-width: 800px;
            margin: 0 auto;
            color: var(--hero-ink);
        }
        .hero-contact h1 {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .hero-contact .hero-subheadline {
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }
    </style>
    <section class="contact-form-section" data-component="contact-form">
        <div class="contact-form-container">
            <h2>Get in Touch</h2>

            <form class="contact-form" action="#contact" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="form-submit">Send Message</button>
            </form>
        </div>
    </section>
    <style>
        /* Layout only - colors inherited from global CSS */
        .contact-form-section {
            padding: var(--spacing-section, 5rem 2rem);
        }
        .contact-form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .contact-form-section h2 {
            text-align: center;
            margin-bottom: 1rem;
        }
        .contact-subtitle {
            text-align: center;
            margin-bottom: 2rem;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea {
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border, #e2e8f0);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-accent, #0f3460);
            box-shadow: 0 0 0 3px rgba(15,52,96,0.1);
        }
        .form-submit {
            padding: 1rem 2rem;
            background: var(--color-accent, #0f3460);
            color: var(--color-white, #fff);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .form-submit:hover {
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .contact-form-section { padding: 3rem 1.5rem; }
        }
    </style>

</main>
</body>
</html>
