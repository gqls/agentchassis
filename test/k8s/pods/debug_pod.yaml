  apiVersion: v1
  kind: Pod
  metadata:
    name: test-debug-pod
    namespace: ai-persona-system
  spec:
    imagePullSecrets:
      - name: docker-hub-creds
    containers:
      - name: test
        image: docker.io/aqls/test-harness:latest
        command: ["sleep", "3600"]
        env:
          - name: DB_HOST
            value: postgres-clients
          - name: DB_USER
            value: clients_user
          - name: DB_NAME
            value: clients_db
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: personae-platform-secrets
                key: CLIENTS_DB_PASSWORD
