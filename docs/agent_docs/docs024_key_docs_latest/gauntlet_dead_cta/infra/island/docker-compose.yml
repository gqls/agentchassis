# Island: /opt/island/docker-compose.yml  (Mythic Beasts VM vds:toolsapisuk,
# toolsapisuk.vs.mythic-beasts.com / 176.126.243.183 — Route B1, decided 2026-07-24)
# Postgres + Caddy run now; the tools-api block activates when the
# feature-builder PR lands and an image exists. Secrets live in /opt/island/.env
# (root-only, NOT in this repo).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tools_api
      POSTGRES_USER: tools_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # host-local only (pg_dump/debugging); never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools_api"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/probe:/var/log/caddy      # features_open/020 probe access logs
    ports:
      - "127.0.0.1:8081:8081"   # only cloudflared (on the host) talks to Caddy
      - "127.0.0.1:8082:8082"   # 020 probe vhost (wildcard/apex catch-all)

  # ACTIVATED 2026-07-25 (PR #3 merged; image loaded via docker save|ssh load —
  # no registry creds on the island). Env contract from the MERGED code
  # (internal/tools-api/config/config.go): PORT (default 8080, matches the
  # Caddyfile upstream), DATABASE_URL + ANTHROPIC_API_KEY required (the service
  # refuses to start if either is empty — until the owner issues the dedicated
  # spend-capped key, .env carries an explicitly-named placeholder so /round is
  # live and /position + /defend fail LOUD via httperr = the honest degraded
  # mode). CORS comes from the island DB's minimal sites table, NOT an env
  # allowlist (the drafted ALLOWED_ORIGINS never existed in the merged code).
  tools-api:
    # v1.0.1359-playground (2026-09-03): Tenant 3 — the finetuning.uk playground
    # demo chat route group (PUB-006, council 63be72d1 r4), mounted only when
    # PLAYGROUND_OLLAMA_URL is set. Built from committed 9b540c2e6 (image label
    # org.opencontainers.image.revision); the suffix because fleet v1.0.1359 is
    # commit 3043885, which predates the route's round-4 refactor. ⚠ The five
    # PLAYGROUND_* keys in .env reach the container ONLY through the Tenant 3
    # block below — this file maps env explicitly, there is no env_file. The
    # first swap (19:06Z) booted with the keys in .env and this block absent,
    # and the log said "playground route group NOT mounted (PLAYGROUND_OLLAMA_URL
    # unset)" — a correct-looking .env is not enough.
    # v1.0.1343 (2026-08-26): 409 round 2, per the council's r1 objection —
    # the travel/jaw-span rule enforced in CODE (reconcile in Normalise), not
    # guidance alone.
    # v1.0.1342 (2026-08-26): the bugs_open/409 chat-side fix — hedge-phrased
    # spec values dropped at Normalise (a vague visitor now gets asked again,
    # not a guaranteed failed report), travel/jaw-span guidance. Council-
    # Submitted 70083c99.
    # v1.0.1340 (2026-08-25): Tenant 2 — the gripper route group (PUB-005),
    # mounted only when GRIPPER_ANTHROPIC_API_KEY is set. Also carries the three
    # gauntlet commits since v1.0.1216 (pages.noindex opt-in for 232; RFC_020
    # §5.2 publish refusal + its negation-guard fix). The RATE_LIMIT block
    # below was tuned live on the box on 2026-07-31 and never committed back —
    # merged into this copy 2026-08-25, so scp'ing this file over the island's
    # no longer silently reverts the owner's limiter settings.
    # v1.0.1216 (2026-07-31): round publication — POST /publish + GET /round/:slug (PUB-004).
    # v1.0.1178 (2026-07-27): the bugs_open/083 diagnosability fix — every 5xx
    # fault path now records its cause, /round's evidence-destroying 502 is a
    # 503, gin.Logger() gives the service a request log for the first time, and
    # an unusable response is logged as a structural fingerprint, never its text.
    # Built from committed HEAD via `make build-tools-api-ref`; shipped by
    # docker save|ssh load (no registry creds on the island, by design).
    image: docker.io/aqls/tools-api:v1.0.1359-playground
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://tools_api:${POSTGRES_PASSWORD}@postgres:5432/tools_api?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}   # DEDICATED spend-capped key, never the platform's
      GAUNTLET_MODEL: claude-sonnet-5
      # Rate limit (2026-07-31, merged back from the live copy 2026-08-25).
      # Per-IP token bucket on the whole /api/v1 group (server.go:39), so ONE
      # ceiling covers both the paid LLM POSTs and the free public
      # GET /round/:slug. Defaults are 1.0 rps / burst 5, chosen for 8-18s LLM
      # calls; a 6-request smoke burst tripped them, and a reader opening 6
      # record links would too. MEASURED: a record page costs exactly 1 request,
      # the gauntlet page 0 until a round starts, a full round plus publish 4
      # over ~90s. So burst is what trips, and burst is what moves most: 20
      # covers ~10 records opened at once with headroom. RPS 2 only doubles the
      # SUSTAINED ceiling, which is the abuse exposure, and refills those 20
      # tokens in 10s. Owner: "roughly right for now, make it so it does not
      # trip often" - revisit with real traffic.
      RATE_LIMIT_RPS: "2"
      RATE_LIMIT_BURST: "20"
      # ── Tenant 2: the gripper-dossier intake (/api/v1/tools/gripper), added
      # 2026-08-16. OPT-IN BY ENV: the route group and its poller mount only
      # when GRIPPER_ANTHROPIC_API_KEY is non-empty (internal/tools-api/config).
      # The `:-` defaults mean an .env that predates this block interpolates to
      # empty and the service boots exactly as before — no warning, no change.
      # Once the key IS set, GRIPPER_PULL_KEY (>=24 chars; must equal the
      # pull_key seed 208 writes on the cluster) and GRIPPER_SMTP_HOST/_FROM are
      # REQUIRED and the process refuses to start without them (fail-loud, the
      # same rule as DATABASE_URL). All values live in /opt/island/.env, root
      # only, never in this repo. Verified pair as of 2026-08-15:
      # GRIPPER_SMTP_HOST=mail.contactforsales.com PORT=465 (implicit TLS —
      # mailer.UsesImplicitTLS's own branch) USER/FROM=robot-hands@contactforsales.com.
      GRIPPER_ANTHROPIC_API_KEY: ${GRIPPER_ANTHROPIC_API_KEY:-}   # its OWN spend-capped key (owner-issued 08-10), never the gauntlet's
      GRIPPER_MODEL: ${GRIPPER_MODEL:-claude-haiku-4-5}
      GRIPPER_PULL_KEY: ${GRIPPER_PULL_KEY:-}
      GRIPPER_SMTP_HOST: ${GRIPPER_SMTP_HOST:-}
      GRIPPER_SMTP_PORT: ${GRIPPER_SMTP_PORT:-465}
      GRIPPER_SMTP_USER: ${GRIPPER_SMTP_USER:-}
      GRIPPER_SMTP_PASS: ${GRIPPER_SMTP_PASS:-}
      GRIPPER_SMTP_FROM: ${GRIPPER_SMTP_FROM:-}
      GRIPPER_SMTP_FROM_NAME: ${GRIPPER_SMTP_FROM_NAME:-Robot Hands}
      # GRIPPER_DAILY_TURN_CAP (default 2000) and GRIPPER_MAX_BODY_BYTES (16384)
      # are deliberately not surfaced here; set them in .env only if needed.
      # ── Tenant 3: the finetuning.uk playground demo chat
      # (POST /api/v1/tools/playground/chat, SSE), added 2026-09-03. OPT-IN BY
      # ENV: the group mounts only when PLAYGROUND_OLLAMA_URL is non-empty
      # (internal/tools-api/config: loadPlayground); the `:-` defaults below are
      # the code's own defaults, so an .env that predates this block boots
      # exactly as before. The model host is the Hetzner box 167.233.33.159
      # (Ollama, model finetuning-demo), whose ufw admits ONLY this island's IP —
      # finetuning_uk_service RUNBOOK "The demo model host". Values in .env.
      PLAYGROUND_OLLAMA_URL: ${PLAYGROUND_OLLAMA_URL:-}
      PLAYGROUND_MODEL: ${PLAYGROUND_MODEL:-finetuning-demo}
      PLAYGROUND_MAX_TOKENS: ${PLAYGROUND_MAX_TOKENS:-150}
      PLAYGROUND_NUM_CTX: ${PLAYGROUND_NUM_CTX:-2048}
      PLAYGROUND_MAX_BODY_BYTES: ${PLAYGROUND_MAX_BODY_BYTES:-8192}
    depends_on:
      postgres:
        condition: service_healthy
    # Bounded logs (added 2026-07-27, council corr e004fd81 advisory, guardian/low).
    # The bugs_open/083 fix attaches gin.Logger(), so this service went from
    # near-silent to one line PER REQUEST plus a line per failure. Compose's
    # default json-file driver is UNBOUNDED, so that change alone could fill the
    # island's disk over time — and a full disk takes Postgres down with it, on a
    # VM whose whole job is to be independently reachable. 10MB x 3 keeps roughly
    # the recent window the RUNBOOK's `logs --since 30m` queries actually read.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
