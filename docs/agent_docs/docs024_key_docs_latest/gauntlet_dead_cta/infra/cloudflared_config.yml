# Bastion: /etc/cloudflared/config.yml
# Tunnel dials OUT to Cloudflare; no inbound ports on the bastion.
tunnel: tools-api
credentials-file: /etc/cloudflared/tools-api.json
ingress:
  - hostname: <SUB>.apis.uk
    service: http://localhost:8081        # Caddy below
  - service: http_status:404              # anything else: refuse
