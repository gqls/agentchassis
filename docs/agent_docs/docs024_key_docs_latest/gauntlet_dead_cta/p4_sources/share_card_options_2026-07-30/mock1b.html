<meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1200" height="630"></canvas>
<script src="round.js"></script>
<script>
// OPTION 1, in its only workable form — the EXCHANGE ONLY, auto-fitted.
// The size is measured, not chosen: the largest at which the challenge and
// the defence both fit once labels, the ruling line and the footer have
// taken their space. Dropped: vonc's 889-char counter-argument and the
// judge's 1,396-char reasons — real content that does not fit.
var W = 1200, H = 630, L = 70, MAXW = W - 140;
var c = document.getElementById("c"), x = c.getContext("2d");
var BLOCKS = [["VONC ASKED", R.challenge, "system-ui, sans-serif"],
              ["I ANSWERED", R.defence, "Georgia, serif"]];
function wrap(text, f, maxWidth) {
  x.font = f;
  var words = String(text).split(/\s+/), line = "", out = [];
  for (var i = 0; i < words.length; i++) {
    var probe = line ? line + " " + words[i] : words[i];
    if (x.measureText(probe).width > maxWidth && line) { out.push(line); line = words[i]; }
    else line = probe;
  }
  if (line) out.push(line);
  return out;
}
var TOP = 112, FOOT = 130;              // header above, ruling + url below
var USABLE = H - TOP - FOOT;
function heightAt(f) {
  var lh = Math.round(f * 1.3), total = 0;
  for (var i = 0; i < BLOCKS.length; i++) {
    total += 34 + wrap(BLOCKS[i][1], "400 " + f + "px " + BLOCKS[i][2], MAXW).length * lh + 26;
  }
  return total;
}
var size = 40;
while (size > 8 && heightAt(size) > USABLE) size--;
document.title = "fit=" + size + "px usable=" + USABLE + " needed=" + heightAt(size)
  + " chars=" + (R.challenge.length + R.defence.length);

x.fillStyle = "#6d28d9"; x.fillRect(0, 0, W, H);
x.fillStyle = "#f59e0b"; x.fillRect(0, 0, 14, H);
x.fillStyle = "rgba(255,255,255,0.8)";
x.font = "700 22px system-ui, sans-serif";
x.fillText("THE GAUNTLET · " + R.headline.toUpperCase().replace(/\.$/, ""), L, 58);

var lh = Math.round(size * 1.3), y = TOP;
for (var i = 0; i < BLOCKS.length; i++) {
  x.fillStyle = "#fbbf24"; x.font = "700 20px system-ui, sans-serif";
  x.fillText(BLOCKS[i][0], L, y); y += 34;
  x.fillStyle = "#ffffff"; x.font = "400 " + size + "px " + BLOCKS[i][2];
  var lines = wrap(BLOCKS[i][1], "400 " + size + "px " + BLOCKS[i][2], MAXW);
  for (var j = 0; j < lines.length; j++) { x.fillText(lines[j], L, y); y += lh; }
  y += 26;
}
x.fillStyle = "#f59e0b"; x.fillRect(L, H - 112, 120, 6);
x.fillStyle = "#ffffff"; x.font = "800 34px system-ui, sans-serif";
x.fillText("The judge ruled: " + R.verdict + ".", H === 630 ? L : L, H - 62);
x.fillStyle = "rgba(255,255,255,0.7)"; x.font = "600 22px system-ui, sans-serif";
x.fillText("vonc.com/tools/gauntlet · 30/07/2026", L, H - 24);
</script>
