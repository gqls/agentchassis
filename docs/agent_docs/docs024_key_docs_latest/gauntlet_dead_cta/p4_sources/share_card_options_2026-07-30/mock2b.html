<meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1200" height="630"></canvas>
<script src="round.js"></script>
<script>
// OPTION 2, card B — "the debate card". Pairs with the existing verdict
// card. Carries the argument the verdict card omits: the challenge, the
// visitor's defence, and the judge's reasons. Size is measured, not chosen.
var W = 1200, H = 630, L = 70, MAXW = W - 140;
var c = document.getElementById("c"), x = c.getContext("2d");
var BLOCKS = [["VONC ASKED", R.challenge, "system-ui, sans-serif"],
              ["I ANSWERED", R.defence, "Georgia, serif"],
              ["WHY I LOST — THE JUDGE'S REASONS", R.reasons, "system-ui, sans-serif"]];
function wrap(text, f, maxWidth) {
  x.font = f;
  var words = String(text).split(/\s+/), line = "", out = [];
  for (var i = 0; i < words.length; i++) {
    var probe = line ? line + " " + words[i] : words[i];
    if (x.measureText(probe).width > maxWidth && line) { out.push(line); line = words[i]; }
    else line = probe;
  }
  if (line) out.push(line);
  return out;
}
var TOP = 106, FOOT = 44, USABLE = H - TOP - FOOT;
function heightAt(f) {
  var lh = Math.round(f * 1.3), total = 0;
  for (var i = 0; i < BLOCKS.length; i++) {
    total += Math.round(f * 1.15) + 10 + wrap(BLOCKS[i][1], "400 " + f + "px " + BLOCKS[i][2], MAXW).length * lh + 18;
  }
  return total;
}
var size = 40;
while (size > 6 && heightAt(size) > USABLE) size--;
var chars = R.challenge.length + R.defence.length + R.reasons.length;
document.title = "fit=" + size + "px usable=" + USABLE + " needed=" + heightAt(size) + " chars=" + chars;

x.fillStyle = "#4c1d95"; x.fillRect(0, 0, W, H);
x.fillStyle = "#f59e0b"; x.fillRect(0, 0, 14, H);
x.fillStyle = "rgba(255,255,255,0.8)";
x.font = "700 22px system-ui, sans-serif";
x.fillText("THE GAUNTLET · THE ARGUMENT · " + R.headline.toUpperCase().replace(/\.$/, ""), L, 52);
x.fillStyle = "#f59e0b"; x.fillRect(L, 74, 120, 5);

var lh = Math.round(size * 1.3), y = TOP;
for (var i = 0; i < BLOCKS.length; i++) {
  x.fillStyle = "#fbbf24"; x.font = "700 " + Math.max(11, Math.round(size * 1.05)) + "px system-ui, sans-serif";
  x.fillText(BLOCKS[i][0], L, y); y += Math.round(size * 1.15) + 10;
  x.fillStyle = "rgba(255,255,255,0.95)"; x.font = "400 " + size + "px " + BLOCKS[i][2];
  var lines = wrap(BLOCKS[i][1], "400 " + size + "px " + BLOCKS[i][2], MAXW);
  for (var j = 0; j < lines.length; j++) { x.fillText(lines[j], L, y); y += lh; }
  y += 18;
}
x.fillStyle = "rgba(255,255,255,0.7)"; x.font = "600 20px system-ui, sans-serif";
x.fillText("vonc.com/tools/gauntlet · 30/07/2026", L, H - 18);
</script>
