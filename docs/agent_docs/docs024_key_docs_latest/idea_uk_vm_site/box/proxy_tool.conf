# /etc/nginx/snippets/proxy_tool.conf — reserved TOOL paths (not the Stripe webhook).
# Values mirrored from the setup.sh-managed conf so the cutover cannot silently
# downgrade the box. See box/README.md "What the live conf carries".

# Rate limit, as setup.sh applied to the old catch-all `location /`.
# Zone `idea_rl` is defined in the conf's preamble (always present).
limit_req zone=idea_rl burst=20 nodelay;

proxy_pass              http://127.0.0.1:8080;
proxy_http_version      1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;

# ⚠️ The engine can take MINUTES to produce a report. nginx's default 60s would
# cut it off mid-run. setup.sh set these on the tool's location; keep them.
proxy_read_timeout      930s;
proxy_send_timeout      930s;
