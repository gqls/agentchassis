# /etc/nginx/snippets/proxy_stripe.conf — THE MONEY PATH. Deliberately separate
# from proxy_tool.conf for one reason: NO rate limit.
#
# setup.sh gave /stripe/webhook its own location with no `limit_req`, and that is
# correct — Stripe retries failed webhooks in bursts, and a 503 from limit_req
# would look like an outage to Stripe and delay/lose payment confirmation.
#
# Stripe verifies a signature over the RAW body. No sub_filter, no body rewrite. Ever.

proxy_pass              http://127.0.0.1:8080;
proxy_http_version      1.1;
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
