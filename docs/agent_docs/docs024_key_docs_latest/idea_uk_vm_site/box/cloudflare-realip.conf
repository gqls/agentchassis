# cloudflare-realip.conf — restore the true client IP behind the Cloudflare proxy.
#
# Install as /etc/nginx/conf.d/cloudflare-realip.conf (http{} context — Ubuntu's
# nginx.conf includes conf.d/*.conf there), then `nginx -t && systemctl reload nginx`.
#
# WHEN: Option B step 2 — BEFORE records go orange, never after. Between "orange"
# and "this file live", every visitor keys the limit_req zone as a Cloudflare edge
# address and the per-IP limiter silently degrades into one global bucket that
# still looks like a working rate limiter (bugs_open/139's failure shape).
# Installing it while records are still grey is a no-op and therefore safe: it
# only trusts CF-Connecting-IP from the ranges below, and while grey nothing
# arrives from them.
#
# The limit_req zone needs NO change: both arms of setup.sh's
# rate_limit_preamble() key on $binary_remote_addr, which this module rewrites
# in place.
#
# PROOF (Option B step 3, before going orange — and again after): from TWO
# different networks, request the site, then confirm the access log shows TWO
# distinct client addresses, neither inside the ranges below. One test machine
# cannot tell a constant from a working key (bugs_open/139: 83/83 rows identical
# read as fine).
#
# Ranges: https://www.cloudflare.com/ips-v4 + /ips-v6, fetched and verified
# 2026-08-02 — identical to the estate snapshot of 2026-07-24
# (traffic_probe/deploy_setup/vm-deploy/setup.sh cloudflare_realip(), the
# canonical copy per vm_estate/PLAN_2026-07-25:44 — do not let the two drift).
# Re-fetch and diff before any re-install.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
