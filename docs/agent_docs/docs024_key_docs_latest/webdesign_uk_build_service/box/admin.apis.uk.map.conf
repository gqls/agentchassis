# /etc/nginx/conf.d/upgrade-map.conf
# Required by admin.apis.uk.nginx's websocket headers. http-level, so it lives
# here rather than in the vhost. Harmless if other vhosts never use it.
# If this map is missing, nginx refuses to start with:
#   "unknown \"connection_upgrade\" variable"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
