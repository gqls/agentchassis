apiVersion: v1
kind: ConfigMap
metadata:
  name: reasoning-test-code
  namespace: ai-persona-system
data:
  test.go: |
	package main
	
	import (
		"context"
		"encoding/json"
		"fmt"
		"log"
		"time"
		"github.com/segmentio/kafka-go"
	)
	
	func main() {
		writer := &kafka.Writer{
			Addr:     kafka.TCP("personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"),
			Topic:    "system.agent.reasoning.process",
			Balancer: &kafka.LeastBytes{},
		}
		defer writer.Close()
		
		// Create reader for responses
		reader := kafka.NewReader(kafka.ReaderConfig{
			Brokers:   []string{"personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"},
			Topic:     "system.responses.reasoning",
			Partition: 0,
			MinBytes:  1,
			MaxBytes:  10e6,
		})
		defer reader.Close()
		
		correlationID := fmt.Sprintf("test-%d", time.Now().Unix())
		
		payload := map[string]interface{}{
			"action": "analyze",
			"data": map[string]interface{}{
				"content_to_review": "The new product launch strategy focuses on social media marketing, influencer partnerships, and targeted email campaigns. We plan to allocate 60% of the budget to digital channels and 40% to traditional media.",
				"review_criteria": []string{
					"Budget allocation appropriateness",
					"Channel mix effectiveness",
					"Target audience alignment",
					"ROI potential",
				},
				"brief_context": map[string]interface{}{
					"product_type":   "B2C software",
					"target_market":  "millennials and gen-z",
					"budget":         100000,
					"timeline":       "3 months",
				},
			},
		}

		jsonBytes, _ := json.Marshal(payload)
		
		msg := kafka.Message{
			Key:   []byte(correlationID),
			Value: jsonBytes,
			Headers: []kafka.Header{
				{Key: "correlation_id", Value: []byte(correlationID)},
				{Key: "request_id", Value: []byte(fmt.Sprintf("req-%d", time.Now().Unix()))},
				{Key: "client_id", Value: []byte("test-client")},
				{Key: "agent_instance_id", Value: []byte("reasoning-001")},
				{Key: "fuel_budget", Value: []byte("100")},
			},
		}
		
		fmt.Printf("=== SENDING REASONING REQUEST ===\n")
		fmt.Printf("Correlation ID: %s\n", correlationID)
		fmt.Printf("Payload: %s\n", string(jsonBytes))

		ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
		defer cancel()
		
		err := writer.WriteMessages(ctx, msg)
		if err != nil {
			log.Fatalf("Failed to write message: %v", err)
		}

		fmt.Println("\n✓ Message sent successfully!")
		fmt.Println("\n=== WAITING FOR RESPONSE ===")
		
		// Wait for response
		responseCtx, responseCancel := context.WithTimeout(context.Background(), 30*time.Second)
		defer responseCancel()
		
		for {
			respMsg, err := reader.FetchMessage(responseCtx)
			if err != nil {
				if err == context.DeadlineExceeded {
					fmt.Println("\n✗ Timeout waiting for response")
					break
				}
				continue
			}

			// Check if this is our response
			for _, h := range respMsg.Headers {
				if h.Key == "correlation_id" && string(h.Value) == correlationID {
					fmt.Printf("\n✓ RECEIVED RESPONSE:\n")
					fmt.Printf("Raw: %s\n", string(respMsg.Value))

					var response map[string]interface{}
					if err := json.Unmarshal(respMsg.Value, &response); err == nil {
						prettyJSON, _ := json.MarshalIndent(response, "", "  ")
						fmt.Printf("\nParsed:\n%s\n", string(prettyJSON))
					}

					reader.CommitMessages(context.Background(), respMsg)
					return
				}
			}
			reader.CommitMessages(context.Background(), respMsg)
		}
	}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-reasoning-agent
  namespace: ai-persona-system
spec:
  template:
    spec:
      containers:
        - name: test
          image: golang:1.21-alpine
          command:
            - sh
            - -c
            - |
              apk add --no-cache git
              cp /config/test.go /tmp/
              cd /tmp
              go mod init test
              go get github.com/segmentio/kafka-go@v0.4.47
              go run test.go
          volumeMounts:
            - name: test-code
              mountPath: /config
      volumes:
        - name: test-code
          configMap:
            name: reasoning-test-code
      restartPolicy: Never