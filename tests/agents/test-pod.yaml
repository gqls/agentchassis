apiVersion: v1
kind: Pod
metadata:
  name: content-creator-test-pod
  namespace: ai-persona-system
spec:
  serviceAccountName: ai-persona-app
  containers:
    - name: test-container
      image: docker.io/aqls/content-creator-agent:latest  # Use your actual agent image
      command: ["sleep", "3600"]  # Keep it running for testing
      env:
        - name: KAFKA_BROKERS
          value: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: personae-dev-secrets
              key: anthropic-api-key
      envFrom:
        - secretRef:
            name: personae-dev-secrets
        - configMapRef:
            name: personae-dev-config