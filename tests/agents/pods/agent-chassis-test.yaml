apiVersion: v1
kind: Pod
metadata:
  name: agent-chassis-test
  namespace: ai-persona-system
spec:
  containers:
    - name: test
      image: golang:1.21-alpine
      command:
        - sh
        - -c
        - |
          apk add --no-cache git
          echo "Test pod ready. Kafka bootstrap service: personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          sleep infinity
          go mod init test
          go get github.com/segmentio/kafka-go
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "personae-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: ANTHROPIC_API_KEY
          value: "your-api-key-here"  # Replace with actual key