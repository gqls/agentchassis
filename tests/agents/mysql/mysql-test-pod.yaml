# Save as mysql-test-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: mysql-connection-test
  namespace: ai-persona-system
spec:
  containers:
    - name: mysql
      image: mysql:8.0
      command: ['sleep', '3600']
      env:
        - name: MYSQL_HOST
          value: "rs17.uk-noc.com"
        - name: MYSQL_USER
          value: "catalogu_personae"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: personae-platform-secrets
              key: auth-db-password
