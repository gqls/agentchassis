apiVersion: v1
kind: Pod
metadata:
  name: content-test-simple
  namespace: ai-persona-system
spec:
  # Comment out serviceAccountName for now if RBAC isn't applied
  # serviceAccountName: ai-persona-app
  containers:
    - name: test
      image: golang:1.21-alpine
      command: ["sleep", "3600"]
      env:
        - name: KAFKA_NAMESPACE
          value: "kafka"
        - name: KAFKA_CLUSTER_NAME
          value: "personae-kafka-cluster"