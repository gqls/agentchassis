apiVersion: batch/v1
kind: Job
metadata:
  generateName: test-agent-spawning-
  namespace: PROJECT_NAME
  labels:
    app: test-spawning
spec:
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: docker-hub-creds
      containers:
        - name: test-runner
          image: REGISTRY/test-spawning:IMAGE_TAG
          env:
            - name: DB_HOST
              value: "postgres-clients"
            - name: DB_NAME
              value: "clients_db"
            - name: DB_USER
              value: "clients_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personae-dev-secrets
                  key: CLIENTS_DB_PASSWORD
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: CLIENT_ID
              value: "demo_client"